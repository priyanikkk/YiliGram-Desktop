name: Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform'
        type: choice
        options: [all, windows, linux]
        default: all

permissions:
  contents: read

jobs:
  linux:
    name: Linux
    if: inputs.platform != 'windows'
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: tdesktop:centos_env
    steps:
      - name: Clone.
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: YiliGram patches.
        run: tools/yiligram/apply_patches.sh

      - name: First set up.
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          cd Telegram/build/docker/centos_env
          poetry install
          DOCKERFILE=$(DEBUG= LTO= poetry run gen_dockerfile)
          echo "$DOCKERFILE" > Dockerfile
          rm -rf __pycache__

      - name: Free up some disk space.
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6
        with:
          tool-cache: true

      - name: Set up Docker Buildx.
        uses: docker/setup-buildx-action@v3

      - name: Libraries cache.
        id: libs-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/.buildx-cache
          key: ${{ runner.OS }}-libs-${{ hashFiles('Telegram/build/docker/centos_env/**') }}
          restore-keys: ${{ runner.OS }}-libs-

      - name: Libraries.
        uses: docker/build-push-action@v6
        with:
          context: Telegram/build/docker/centos_env
          load: true
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=local,src=${{ runner.temp }}/.buildx-cache
          cache-to: type=local,dest=${{ runner.temp }}/.buildx-cache-new,mode=max

      - name: Move cache.
        run: |
          rm -rf ${{ runner.temp }}/.buildx-cache
          mv ${{ runner.temp }}/.buildx-cache{-new,}

      - name: Save libraries cache.
        if: steps.libs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/.buildx-cache
          key: ${{ runner.OS }}-libs-${{ hashFiles('Telegram/build/docker/centos_env/**') }}

      - name: Build.
        env:
          API_ID: ${{ secrets.TDESKTOP_API_ID }}
          API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          if [ -n "$API_ID" ]; then API="-D TDESKTOP_API_ID=$API_ID -D TDESKTOP_API_HASH=$API_HASH"; else API="-D TDESKTOP_API_TEST=ON"; fi
          docker run --rm \
          -u $(id -u) \
          -v $PWD:/usr/src/tdesktop \
          -e CONFIG=Release \
          $IMAGE_TAG \
          /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
          -D CMAKE_CONFIGURATION_TYPES=Release \
          $API \
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON \
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

      - name: Package.
        run: |
          mkdir -p dist/YiliGram
          cp out/Release/Telegram dist/YiliGram/YiliGram
          strip dist/YiliGram/YiliGram || true
          cp LICENSE dist/YiliGram/
          tar -C dist -cJf YiliGram-linux-x64.tar.xz YiliGram

      - uses: actions/upload-artifact@v4
        with:
          name: YiliGram-linux-x64
          path: YiliGram-linux-x64.tar.xz

  windows:
    name: Windows
    if: inputs.platform != 'linux'
    runs-on: windows-latest
    env:
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"
    defaults:
      run:
        shell: cmd
    steps:
      - name: Prepare directories.
        run: |
          for %%I in ("%GITHUB_WORKSPACE%") do set DRIVE=%%~dI
          mkdir %DRIVE%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %DRIVE%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: YiliGram patches.
        shell: bash
        run: $TBUILD/$REPO_NAME/tools/yiligram/apply_patches.sh

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV
          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV
          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake
          git config --global user.email "build@localhost"
          git config --global user.name "build"

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        id: tp-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-third-party-

      - name: Libraries cache.
        id: win-libs-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.LibrariesPath }}
          key: ${{ runner.OS }}-x64-qt6-release-libs-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-qt6-release-libs-

      - name: Libraries.
        id: libs
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent qt6 || %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent qt6

      - name: Free up some disk space.
        shell: bash
        run: |
          find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete
          df -h

      - name: Save ThirdParty cache.
        if: always() && steps.tp-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-third-party-${{ env.CACHE_KEY }}

      - name: Save libraries cache.
        if: always() && steps.win-libs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.LibrariesPath }}
          key: ${{ runner.OS }}-x64-qt6-release-libs-${{ env.CACHE_KEY }}

      - name: Build.
        env:
          API_ID: ${{ secrets.TDESKTOP_API_ID }}
          API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          set API=-D TDESKTOP_API_TEST=ON
          if not "%API_ID%"=="" set API=-D TDESKTOP_API_ID=%API_ID% -D TDESKTOP_API_HASH=%API_HASH%
          cd %TBUILD%\%REPO_NAME%\Telegram
          call configure.bat x64 qt6 %API% ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON
          cmake --build ..\out --config Release --parallel

      - name: Package.
        shell: bash
        run: |
          mkdir -p dist/YiliGram
          cp "$TBUILD/$REPO_NAME/out/Release/Telegram.exe" dist/YiliGram/YiliGram.exe
          cp "$TBUILD/$REPO_NAME/LICENSE" dist/YiliGram/
          cd dist && 7z a ../YiliGram-windows-x64.zip YiliGram

      - uses: actions/upload-artifact@v4
        with:
          name: YiliGram-windows-x64
          path: YiliGram-windows-x64.zip
